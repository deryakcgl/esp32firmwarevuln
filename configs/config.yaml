paths:
  model_output: ./output/models
  dataset_output: ./output/datasets

labeling:
  excel_path: null

llm:
  model: llama3.2
  ollama_url: http://localhost:11434
  ollama_timeout: 120
  temperature: 0.3

extraction:
  elf_max_functions: 400
  elf_max_disasm_bytes: 8192

model:
  type: xgboost
  threshold: 0.4
  n_estimators: 1000
  max_depth: 15
  learning_rate: 0.005
