paths:
  analysis_output: ./output/analysis
  model_output: ./output/models
  dataset_output: ./output/datasets
  firmware_samples: ./firmware_samples
extraction:
  binwalk_path: binwalk
  emba_path: /tmp/emba/emba
  ghidra_path: /opt/homebrew/Cellar/ghidra/11.4.2/libexec/support/analyzeHeadless
features:
  structural:
    enabled: true
    include_entropy: true
    include_cfg_metrics: true
  peripheral:
    enabled: true
    io_patterns:
    - uart
    - spi
    - i2c
    - gpio
    - wifi
    - bluetooth
  embeddings:
    enabled: true
    model_name: gpt-4
llm:
  provider: pattern
  model: llama3
  ollama_url: http://localhost:11434
  api_key: null
  temperature: 0.3
  max_tokens: 500
  cwe_categories:
  - CWE-79
  - CWE-89
  - CWE-120
  - CWE-190
  - CWE-787
  - CWE-416
model:
  type: xgboost
  n_estimators: 1000  # Significantly increased from 200
  max_depth: 15  # Increased from 8
  learning_rate: 0.005  # Decreased from 0.05 (better with more trees)
  threshold: 0.4
  scale_pos_weight: auto
  fn_cost_multiplier: 5.0
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3  # Increased from 1 (more regularization)
  gamma: 0.5  # Increased from 0.1 (more regularization)
  reg_alpha: 1.0  # Increased from 0.1 (L1 regularization - feature selection)
  reg_lambda: 5.0  # Increased from 1.0 (L2 regularization - reduce CWE dependency)
  cwe_boost_factor: 0.3  # Post-processing: boost score by 0.3 if CWE exists (max 0.95)
validation:
  fuzzing:
    enabled: true
    qemu_path: /opt/homebrew/bin/qemu-system-xtensa
    afl_path: /usr/local/bin/afl-fuzz
    timeout: 3600
    max_crashes: 100
  hardware:
    enabled: true
    ina219_address: 64
    oscilloscope_enabled: false
    power_trace_samples: 10000
    cnn_model_path: ./models/power_cnn.h5
metrics:
  compute_vcr: true
  compute_sri: true
  sri_weights:
    precision: 0.25
    recall: 0.25
    f1: 0.3
    vcr: 0.2
